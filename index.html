<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIEL Sky</title>

  <style>
    body{
      margin:0;
      background:#0b1220;
      color:#e6edf3;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    }

    #login{
      position:fixed;
      inset:0;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0b1220;
      z-index:1000;
    }

    .hidden{display:none;}

    .login-box{
      background:#111827;
      padding:30px;
      border-radius:20px;
      width:100%;
      max-width:360px;
      border:1px solid #1f2937;
    }

    input{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #1f2937;
      background:#0f172a;
      color:white;
      margin-bottom:12px;
    }

    button.primary{
      width:100%;
      padding:12px;
      border-radius:8px;
      background:#2563eb;
      border:none;
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    header{
      position:fixed;
      top:0;
      width:100%;
      background:#0b1220;
      border-bottom:1px solid #1f2937;
      padding:16px;
      font-weight:600;
      z-index:10;
    }

    main{
      padding-top:70px;
      padding-bottom:80px;
      max-width:650px;
      margin:auto;
    }

    nav{
      position:fixed;
      bottom:0;
      width:100%;
      background:#0b1220;
      border-top:1px solid #1f2937;
      display:flex;
      justify-content:space-around;
      padding:12px 0;
    }

    svg{width:20px;height:20px;}
  </style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>BIEL Sky</h2>
    <input id="handle" placeholder="Usuário">
    <input id="password" type="password" placeholder="App Password">
    <button class="primary" onclick="doLogin()">Entrar</button>
  </div>
</div>

<header>BIEL Sky</header>
<main id="app"></main>

<nav>
  <button onclick="loadHome()">Home</button>
  <button onclick="loadProfile()">Profile</button>
</nav>

<script type="module" src="/js/main.js"></script>

</body>
</html>
