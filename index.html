<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIEL Sky</title>

<link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css">

<style>
body{
  background:#0b1220;
  color:#e6edf3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

/* LOGIN */
#login{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b1220;
  z-index:999;
}

.hidden{ display:none !important; }

.login-box{
  background:#111827;
  padding:30px;
  border-radius:20px;
  width:100%;
  max-width:360px;
  border:1px solid #1f2937;
}

input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #1f2937;
  background:#0f172a;
  color:white;
  margin-bottom:12px;
}

button.primary{
  width:100%;
  padding:12px;
  border-radius:8px;
  background:#2563eb;
  border:none;
  color:white;
  font-weight:600;
  cursor:pointer;
}

header{
  position:fixed;
  top:0;
  width:100%;
  background:#0b1220;
  border-bottom:1px solid #1f2937;
  padding:16px;
  font-weight:600;
  z-index:10;
}

main{
  padding-top:70px;
  padding-bottom:80px;
  max-width:650px;
  margin:auto;
}

/* POSTS */
.post-card{
  padding:16px;
  border-bottom:1px solid #1f2937;
}

.post{
  display:flex;
  gap:12px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  cursor:pointer;
}

.post-body{
  flex:1;
}

.post-top{
  display:flex;
  align-items:center;
  gap:6px;
}

.handle{
  color:#9ca3af;
}

.date{
  margin-left:auto;
  font-size:13px;
  color:#6b7280;
}

.post-text{
  margin:8px 0;
  line-height:1.5;
}

.post-image{
  width:100%;
  border-radius:14px;
  margin-top:10px;
}

.actions{
  display:flex;
  gap:25px;
  margin-top:10px;
}

.action-btn{
  display:flex;
  align-items:center;
  gap:6px;
  background:none;
  border:none;
  color:#9ca3af;
  cursor:pointer;
}

.action-btn:hover{
  color:#3b82f6;
}

nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#0b1220;
  border-top:1px solid #1f2937;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
}
</style>
</head>

<body>

<div id="login">
  <div class="login-box">
    <h2>BIEL Sky</h2>
    <input id="handle" placeholder="Usuário">
    <input id="password" type="password" placeholder="App Password">
    <button class="primary" onclick="doLogin()">Entrar</button>
  </div>
</div>

<header>BIEL Sky</header>
<main id="app"></main>

<nav>
<button onclick="router.go('home')">Home</button>
<button onclick="router.go('search')">Search</button>
<button onclick="router.go('profile')">Profile</button>
</nav>

<script type="module" src="./js/app.js"></script>
</body>
</html>
