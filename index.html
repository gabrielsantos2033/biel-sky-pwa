<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BIEL Sky</title>

<link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css">

<style>
body{
  background:#0b1220;
  color:#e6edf3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

header{
  position:fixed;
  top:0;
  width:100%;
  backdrop-filter:blur(10px);
  background:rgba(11,18,32,.8);
  padding:15px;
  font-weight:600;
  border-bottom:1px solid #1f2937;
  z-index:10;
}

main{
  padding-top:70px;
  padding-bottom:80px;
  max-width:650px;
  margin:auto;
}

.card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.post-header{
  display:flex;
  gap:10px;
  align-items:center;
  cursor:pointer;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
}

.actions{
  display:flex;
  gap:20px;
  margin-top:10px;
}

button{
  background:none;
  border:none;
  color:#9ca3af;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
}

button:hover{
  color:#3b82f6;
}

nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#0b1220;
  border-top:1px solid #1f2937;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}

input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #1f2937;
  background:#0f172a;
  color:white;
  margin-bottom:10px;
}
</style>
</head>
<body>

<header>BIEL Sky</header>
<main id="app"></main>

<nav>
<button onclick="router.go('home')">Home</button>
<button onclick="router.go('discover')">Discover</button>
<button onclick="router.go('search')">Search</button>
<button onclick="router.go('profile')">Profile</button>
</nav>

<script type="module" src="./js/app.js"></script>

</body>
</html>
